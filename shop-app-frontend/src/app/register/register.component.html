<div class="container">
    <form #registerForm="ngForm">
        <div class="row">
            <div class="col-md-6 offset-md-3">
                <div class="register-form mx-auto">
                    <h2 class="register-header">Đăng ký</h2>
                    <div class="form-group">
                        <label for="phoneNumber">Số điện thoại</label>
                        <input type="text" class="form-control" id="phoneNumber"
                            [(ngModel)]="phoneNumber" 
                            (ngModelChange)="onPhoneChange()"
                            (focus)="registerForm.form.markAsTouched()"
                            name="phoneNumber">
                        <div class="divider-nospace"></div>
                        <p class="text-danger" 
                            *ngIf="phoneNumber.length < 6 && registerForm.form.touched">
                            Phone phải có ít nhất 6 ký tự
                        </p>
                    </div>
                    <div class="mt-3"></div>
                    <div class="form-group password-field">
                        <label for="password">Mật khẩu</label>
                        <input type="password" placeholder="Ít nhất 3 ký tự" 
                            class="form-control" id="password"
                            [(ngModel)]="password"
                            (focus)="registerForm.form.markAsTouched()"
                            name="password">
                        <i class="password-toggle fas fa-eye-slash"></i>
                        <div class="divider-nospace"></div>
                        <p class="text-danger" 
                            *ngIf="password.length < 3 && registerForm.form.touched">
                            Password phải có ít nhất 3 ký tự
                    </div>
                    <div class="mt-3"></div>
                    <div class="form-group password-field">
                        <label for="retype-password">Gõ lại mật khẩu</label>
                        <input type="password" placeholder="Ít nhất 3 ký tự" 
                            class="form-control" id="retype-password"
                            [(ngModel)]="retypePassword"
                            (focus)="registerForm.form.markAsTouched(); checkPasswordsMatch()"
                            name="retypePassword">
                        <i class="password-toggle fas fa-eye-slash"></i>
                        <div class="divider-nospace"></div>
                        <p class="text-danger" 
                            *ngIf="retypePassword.length < 3 && registerForm.form.touched">
                            Vui lòng nhập lại mật khẩu (ít nhất 3 ký tự)
                        </p>
                        <p class="text-danger" 
                            *ngIf="registerForm.controls['retypePassword']?.hasError('passwordMismatch') 
                                && registerForm.form.touched">
                            Mật khẩu không khớp
                        </p>
                    </div>
                    <div class="mt-3"></div>
                    <div class="form-group">
                        <label for="full-name">Họ và tên</label>
                        <input type="text" class="form-control" id="full-name"
                            [(ngModel)]="fullName"
                            name="fullName">
                        <div class="divider-nospace"></div>
                    </div>
                    <div class="form-group">
                        <label for="date-of-birth">Ngày sinh</label>
                        <input type="date" class="form-control" id="date-of-birth"
                            [(ngModel)]="dateOfBirth"
                            (focus)="registerForm.form.markAsTouched(); checkAge()"
                            name="dateOfBirth">
                        <div class="divider-nospace"></div>
                        <p class="text-danger" 
                            *ngIf="registerForm.controls['dateOfBirth']?.hasError('invalidAge') 
                                && registerForm.form.touched">
                            Bạn chưa đủ 18 tuổi
                        </p>
                    </div>
                    <div class="mt-3"></div>
                    <div class="form-group">
                        <label for="address">Địa chỉ</label>
                        <input type="text" class="form-control" id="address"
                            [(ngModel)]="address"
                            name="address">
                        <div class="divider-nospace"></div>
                    </div>
                    <div class="form-group">
                        <div class="form-check checkbox-text">
                            <span style="display: flex;">
                                <input type="checkbox" class="form-check-input" id="isAccepted"
                                    [(ngModel)]="isAccepted"
                                    name="isAccepted">
                                <label class="form-check-label text-start" for="isAccepted">
                                    Tôi đồng ý với các điều khoản và điều kiện</label>
                            </span>
                        </div>
                    </div>
                    <button type="button" 
                        (click)="register()"
                        class="register-button">Đăng ký</button>
                    <div class="divider"></div>
                    <p class="text-center">Bạn đã có tài khoản? <span>
                        <a href="#" class="register-link">Đăng nhập</a></span></p>
                </div>
            </div>
        </div>
    </form>
</div>
<app-footer></app-footer>
