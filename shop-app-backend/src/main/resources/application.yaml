server:
  port: 8088
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/shopapp?useSSL=false&serverTimezone=UTC
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: newpassword
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
api:
  prefix: api/v1
jwt:
  expiration: 2592000 #30 days = 30 * 24 * 60 * 60
